<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1060" viewBox="0 0 1700 1060" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12.5px;fill:#334155}
      .h{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#475569}
      .l{font-size:12px;fill:#0f172a;font-weight:600}
      .lb{fill:#ffffff;stroke:none}
    </style>
  </defs>
  <rect width="1700" height="1060" fill="#ffffff"/>

  <text x="40" y="48" font-size="26" font-weight="800" fill="#0f172a">Home Awareness: system architecture</text>
  <text x="40" y="72" class="s">Sensors analyse sound on the device. Only small events reach the cloud. The cloud applies each household's rules and alerts each member their way.</text>

  <!-- ============ HOME ============ -->
  <rect x="30" y="95" width="380" height="680" rx="16" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
  <text x="50" y="125" class="h">EACH HOUSEHOLD'S HOME</text>

  <rect x="50" y="145" width="340" height="140" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="66" y="172" class="t">📱 Spare phone sensor</text>
  <text x="66" y="196" class="s">Sensor web page in the browser</text>
  <text x="66" y="216" class="s">YAMNet runs in the browser (on device)</text>
  <text x="66" y="236" class="s">Wake Lock keeps screen on, on charger</text>
  <text x="66" y="256" class="s">Paired with a one-time code</text>
  <text x="66" y="274" class="s" fill="#64748b">Fallback: Python client in Termux</text>

  <rect x="50" y="305" width="340" height="140" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="66" y="332" class="t">💻 Laptop sensor (optional)</text>
  <text x="66" y="356" class="s">Python edge client</text>
  <text x="66" y="376" class="s">sounddevice → YAMNet on device</text>
  <text x="66" y="396" class="s">Locked to the chosen mic, not headset</text>
  <text x="66" y="416" class="s">Lowers sensitivity while speakers play</text>
  <text x="66" y="434" class="s" fill="#64748b">Only senses while the laptop is on</text>

  <rect x="50" y="465" width="340" height="110" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="66" y="492" class="t" fill="#475569">Future devices</text>
  <text x="66" y="516" class="s">CCTV camera · water-leak alarm · IoT</text>
  <text x="66" y="536" class="s">Raspberry Pi · USB microphone</text>
  <text x="66" y="556" class="s" fill="#64748b">Same event format, no redesign</text>

  <rect x="50" y="600" width="340" height="155" rx="10" fill="#ccfbf1" stroke="none"/>
  <text x="66" y="628" class="t">🔒 Privacy boundary</text>
  <text x="66" y="652" class="s">Raw audio never leaves the device.</text>
  <text x="66" y="672" class="s">Nothing is recorded to disk.</text>
  <text x="66" y="696" class="s">An event is only:</text>
  <text x="66" y="716" class="s" font-family="monospace">device · type · confidence · time</text>
  <text x="66" y="740" class="s">Only sounds a member enabled are sent.</text>

  <!-- ============ CLOUD ============ -->
  <rect x="470" y="95" width="720" height="680" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="490" y="125" class="h">ORACLE CLOUD ALWAYS FREE VM · DOCKER COMPOSE</text>

  <rect x="510" y="145" width="640" height="70" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="530" y="173" class="t">Caddy reverse proxy</text>
  <text x="530" y="197" class="s">HTTPS with free Let's Encrypt certificate · free DuckDNS subdomain</text>

  <rect x="510" y="245" width="640" height="235" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="530" y="273" class="t">FastAPI server (async · Pydantic v2 · SQLAlchemy · Alembic)</text>
  <g font-size="12.5">
    <rect x="530" y="290" width="195" height="80" rx="8" fill="#dbeafe"/>
    <text x="542" y="312" class="l">Auth &amp; households</text>
    <text x="542" y="331" class="s">JWT for members</text>
    <text x="542" y="348" class="s">hashed device keys</text>
    <text x="542" y="365" class="s">sign-up · invites · pairing</text>

    <rect x="735" y="290" width="195" height="80" rx="8" fill="#dbeafe"/>
    <text x="747" y="312" class="l">Event ingest</text>
    <text x="747" y="331" class="s">events + heartbeats</text>
    <text x="747" y="348" class="s">rate limits per device</text>
    <text x="747" y="365" class="s">offline-sensor detection</text>

    <rect x="940" y="290" width="195" height="80" rx="8" fill="#dbeafe"/>
    <text x="952" y="312" class="l">Rule engine</text>
    <text x="952" y="331" class="s">enabled sounds per member</text>
    <text x="952" y="348" class="s">repeat N times in T sec</text>
    <text x="952" y="365" class="s">cooldown · multi-sensor merge</text>

    <rect x="530" y="380" width="297" height="84" rx="8" fill="#dbeafe"/>
    <text x="542" y="402" class="l">Tenant isolation layer</text>
    <text x="542" y="421" class="s">every query scoped by household_id</text>
    <text x="542" y="438" class="s">isolation tests on every endpoint,</text>
    <text x="542" y="455" class="s">WebSocket and device key</text>

    <rect x="838" y="380" width="297" height="84" rx="8" fill="#dbeafe"/>
    <text x="850" y="402" class="l">WebSocket hub · REST API</text>
    <text x="850" y="421" class="s">live events to dashboard</text>
    <text x="850" y="438" class="s">alerts to laptop alert agent</text>
    <text x="850" y="455" class="s">/health · /metrics · structured logs</text>
  </g>

  <rect x="510" y="525" width="200" height="120" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="526" y="552" class="t">Redis</text>
  <text x="526" y="576" class="s">cooldown keys</text>
  <text x="526" y="594" class="s">merge windows</text>
  <text x="526" y="612" class="s">rate-limit counters</text>
  <text x="526" y="630" class="s">pub/sub · job queue</text>

  <rect x="730" y="525" width="200" height="120" rx="10" fill="#fff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="746" y="552" class="t">PostgreSQL</text>
  <text x="746" y="576" class="s">households · members</text>
  <text x="746" y="594" class="s">devices · sound catalog</text>
  <text x="746" y="612" class="s">rules · alert channels</text>
  <text x="746" y="630" class="s">event history</text>

  <rect x="950" y="525" width="200" height="120" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="966" y="552" class="t">Celery worker</text>
  <text x="966" y="576" class="s">alert delivery</text>
  <text x="966" y="594" class="s">retries with backoff</text>
  <text x="966" y="612" class="s">failures recorded</text>
  <text x="966" y="630" class="s">behind job-runner interface</text>

  <rect x="510" y="680" width="640" height="70" rx="10" fill="#fff" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="530" y="708" class="t">Nightly backup</text>
  <text x="530" y="731" class="s">pg_dump on the VM + an off-VM copy · restore tested into Neon</text>

  <!-- ============ USERS ============ -->
  <rect x="1270" y="95" width="400" height="680" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="1290" y="125" class="h">HOUSEHOLD MEMBERS (ANYWHERE)</text>

  <rect x="1290" y="145" width="360" height="95" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1306" y="172" class="t">📲 Telegram bot → phone push</text>
  <text x="1306" y="196" class="s">each member links their own chat</text>
  <text x="1306" y="216" class="s">works with the laptop off</text>

  <rect x="1290" y="255" width="360" height="70" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="1306" y="282" class="t" fill="#475569">ntfy (optional)</text>
  <text x="1306" y="305" class="s">random secret topic per member</text>

  <rect x="1290" y="345" width="360" height="125" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1306" y="372" class="t">🖥 Dashboard (phone + laptop)</text>
  <text x="1306" y="396" class="s">responsive web page</text>
  <text x="1306" y="416" class="s">devices online/offline · live events</text>
  <text x="1306" y="436" class="s">choose sounds, rules, alert channels</text>
  <text x="1306" y="456" class="s">browser popup while tab is open</text>

  <rect x="1290" y="490" width="360" height="125" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1306" y="517" class="t">🎧 Laptop alert agent</text>
  <text x="1306" y="541" class="s">native desktop popup, or</text>
  <text x="1306" y="561" class="s">alarm through current output device</text>
  <text x="1306" y="581" class="s">= your headphones when plugged in</text>
  <text x="1306" y="601" class="s" fill="#64748b">part of the laptop edge client</text>

  <rect x="1290" y="640" width="360" height="110" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="1306" y="667" class="t">✉ Email (free SMTP)</text>
  <text x="1306" y="691" class="s">sign-up confirmation</text>
  <text x="1306" y="711" class="s">password reset · invites</text>
  <text x="1306" y="731" class="s" fill="#64748b">behind a swappable interface</text>

  <!-- ============ ARROWS ============ -->
  <!-- sensors -> caddy -->
  <path d="M390,215 C450,215 450,170 508,170" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#at)"/>
  <path d="M390,375 C455,375 450,195 508,195" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#at)"/>
  <path d="M390,520 C455,520 455,330 528,330" fill="none" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#at)"/>
  <rect x="400" y="233" width="64" height="38" class="lb"/>
  <text x="404" y="248" font-size="11" fill="#0f766e" font-weight="700">HTTPS</text>
  <text x="404" y="264" font-size="11" fill="#0f766e">events</text>
  <rect x="398" y="420" width="70" height="38" class="lb"/>
  <text x="402" y="435" font-size="11" fill="#0f766e">+ heart-</text>
  <text x="402" y="451" font-size="11" fill="#0f766e">beats</text>
  <rect x="402" y="478" width="62" height="20" class="lb"/>
  <text x="404" y="492" font-size="11" fill="#0f766e">MQTT later</text>

  <!-- caddy -> fastapi -->
  <line x1="830" y1="215" x2="830" y2="243" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- fastapi <-> stores -->
  <line x1="610" y1="480" x2="610" y2="523" stroke="#334155" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="830" y1="480" x2="830" y2="523" stroke="#334155" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="1050" y1="480" x2="1050" y2="523" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="1058" y="508" font-size="11" fill="#334155">enqueue alert</text>
  <line x1="1050" y1="645" x2="1050" y2="678" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="830" y1="645" x2="830" y2="678" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>

  <!-- celery -> telegram, ntfy, email -->
  <path d="M1150,560 H1222 V192 H1288" fill="none" stroke="#c2410c" stroke-width="2.2" marker-end="url(#ao)"/>
  <path d="M1222,290 H1288" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ao)"/>
  <path d="M1150,600 H1222 V695 H1288" fill="none" stroke="#c2410c" stroke-width="2.2" marker-end="url(#ao)"/>

  <!-- fastapi websocket -> dashboard & laptop agent -->
  <path d="M1135,420 H1245 V407 H1288" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M1135,450 H1245 V552 H1288" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#a)"/>
  <rect x="1198" y="463" width="66" height="34" class="lb"/>
  <text x="1201" y="477" font-size="11" fill="#7c3aed" font-weight="700">WebSocket</text>
  <text x="1201" y="492" font-size="11" fill="#7c3aed">live + alerts</text>

  <!-- ============ FALLBACK ============ -->
  <rect x="470" y="810" width="720" height="150" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="490" y="840" class="h">NO-CARD FALLBACK · SAME DOCKER IMAGE, CONFIG BY ENV VARS</text>
  <rect x="490" y="858" width="220" height="86" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="506" y="884" class="t">Render free web</text>
  <text x="506" y="906" class="s">FastAPI + in-process jobs</text>
  <text x="506" y="926" class="s">kept awake by heartbeats</text>
  <rect x="720" y="858" width="220" height="86" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="736" y="884" class="t">Neon Postgres</text>
  <text x="736" y="906" class="s">free, 1 GB, no card</text>
  <text x="736" y="926" class="s">restore target for backups</text>
  <rect x="950" y="858" width="220" height="86" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="966" y="884" class="t">Upstash Redis</text>
  <text x="966" y="906" class="s">free, 500K commands/month</text>
  <text x="966" y="926" class="s">no Redis on every heartbeat</text>
  <line x1="830" y1="775" x2="830" y2="808" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="840" y="797" font-size="11" fill="#64748b">move here if Oracle stops the VM</text>

  <!-- ============ LEGEND / FLOW ============ -->
  <rect x="30" y="810" width="410" height="230" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="50" y="840" class="h">ONE ALERT, END TO END</text>
  <g class="s" font-size="12.5">
    <text x="50" y="866">1. Phone hears a scream, YAMNet tags it on device</text>
    <text x="50" y="888">2. Event sent over HTTPS with the device key</text>
    <text x="50" y="910">3. Server scopes it to the household, stores it</text>
    <text x="50" y="932">4. Rule engine: enabled? repeats met? cooldown?</text>
    <text x="50" y="954">   one scream on 2 sensors → 1 incident</text>
    <text x="50" y="976">5. Celery delivers to each member's channels</text>
    <text x="50" y="998">6. Telegram push · dashboard · popup or alarm</text>
    <text x="50" y="1020">   in your headphones</text>
  </g>
  <g font-size="11.5">
    <line x1="1220" y1="830" x2="1260" y2="830" stroke="#0f766e" stroke-width="2.2"/><text x="1268" y="834" fill="#334155">sensor → cloud (events, heartbeats)</text>
    <line x1="1220" y1="856" x2="1260" y2="856" stroke="#c2410c" stroke-width="2.2"/><text x="1268" y="860" fill="#334155">background alert delivery</text>
    <line x1="1220" y1="882" x2="1260" y2="882" stroke="#7c3aed" stroke-width="2.2"/><text x="1268" y="886" fill="#334155">live WebSocket push</text>
    <line x1="1220" y1="908" x2="1260" y2="908" stroke="#334155" stroke-width="2"/><text x="1268" y="912" fill="#334155">internal calls</text>
    <line x1="1220" y1="934" x2="1260" y2="934" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/><text x="1268" y="938" fill="#334155">optional, later, or fallback</text>
    <text x="1220" y="972" fill="#64748b">Cost: $0 · Not a medical, security or</text>
    <text x="1220" y="990" fill="#64748b">emergency device: a home-awareness tool.</text>
  </g>
</svg>
