[project]
name = "home-awareness-edge"
version = "0.1.0"
description = "Home Awareness edge client: laptop sound sensor and alert agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "httpx",
  "httpx-ws",
  "platformdirs",
  "ai-edge-litert",
  "desktop-notifier",
]

[project.optional-dependencies]
# Needs the system PortAudio library (apt install libportaudio2).
portaudio = ["sounddevice"]

[project.scripts]
ha-sensor = "ha_edge.cli:sensor_main"
ha-agent = "ha_edge.cli:agent_main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_edge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
