name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: home
          POSTGRES_PASSWORD: home
          POSTGRES_DB: home_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U home" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://home:home@localhost:5432/home_test
      TEST_DATABASE_URL: postgresql+asyncpg://home:home@localhost:5432/home_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run pytest -q
      - run: docker build -t home-awareness .
